schema_version: dcvpp.e2e_moe_distributional_r4.formal.v1

project:
  version: R4-V6
  architecture_name: Continuous-Distributional-CfC-Transformer-Top2MoE-DART-VPP
  architecture_version: continuous_distributional_joint_moe_r4_v6
  training_semantics_revision: r4_distributional_world_latent_variable_n_curriculum_cycle2_v1
  experiment_id: e2e_moe_distributional_r4_v6_formal_v1
  implementation_namespace: dcvpp.e2e_moe_r4
  output_root: artifacts/e2e_moe_distributional_r4_v6_formal
  preserve_v5_read_only: true
  reuse_selected_representation_only: true
  resume_fixed_particle_scenario: false

protocol:
  active_seed: 20240813
  seeds: [20240813, 20240829, 20240917]
  phase_order: [representation, distribution, joint_policy, a1, a2]
  mainline_first: true
  continue_after_seed1_only_on: R4_V6_MAINLINE_PASS
  architecture_correction_cycle: 2
  splits:
    train: {start: "2022-01-01", end: "2023-06-30"}
    validation: {start: "2023-07-01", end: "2023-12-31"}
    final_temporal_test:
      start: "2024-01-01"
      end: "2024-12-31"
      sealed_until_all_methods_frozen: true
      execute_once: true
    locked:
      year: 2025
      reject_path_before_open: true
  prohibit_2024_for:
    - normalization
    - architecture_selection
    - hyperparameter_selection
    - checkpoint_selection
    - capability_gate_repair
    - baseline_calibration

lineage:
  representation_selected_checkpoint: artifacts/e2e_moe_hybrid_r4_v5_formal/seed=20240813/phase=representation/checkpoints/representation_seed20240813_selected_best.pt
  representation_state: artifacts/e2e_moe_hybrid_r4_v5_formal/seed=20240813/phase=representation/state.json
  train_only_normalization: artifacts/e2e_moe_hybrid_r4_v5_formal/data/train_only_normalization.json
  representation_baselines: artifacts/e2e_moe_hybrid_r4_v5_formal/data/representation_baselines.json
  v5_failed_scenario_state: artifacts/e2e_moe_hybrid_r4_v5_formal/seed=20240813/phase=scenario/state.json
  distribution_support_artifact: artifacts/e2e_moe_distributional_r4_v6_formal/data/distribution_support_contract.json
  distribution_support_hash_source: frozen_preflight_manifest
  residual_score_contract: artifacts/e2e_moe_hybrid_r4_v5_formal/data/scenario_training_contract.json
  reuse_selected_representation_epoch: 28
  allow_representation_prefixes_only: true
  reject_legacy_scenario_risk_policy_heads: true
  supersede_reason: fixed_particle_distribution_failed_179_day_gate

data:
  selection_bundle_root: artifacts/dart_value_select/counterfactual_inputs/v1/selection/daily_bundles
  official_settlement_root: artifacts/dart_value_select/real_input_preparation/v1/official_rt_recovery/nyiso_replay_by_date/selection
  canonical_selection_index: artifacts/dart_value_select/real_input_preparation/v1/official_rt_recovery/selection_nyiso_replay_by_date_index.json
  frozen_physical_twin: artifacts/research/physical/run_id=paper-physical-v1/frozen_physical_artifact.json
  frozen_physical_surrogate: artifacts/research/physical/run_id=paper-physical-v1/frozen_piecewise_surrogate.json
  physical_calibration_manifest: artifacts/research/physical/run_id=paper-physical-v1/physical_calibration_manifest.json
  intervals_per_day: 96
  zones: [WEST, CAPITL, N.Y.C., LONGIL]
  availability_contract:
    strict: true
    allowed_when: feature_available_at <= decision_time
    unknown_provenance: exclude
    future_realizations_in_plan_stream: forbidden
  history:
    completed_day_summary_tokens: 7
    raw_history_tokens: false
  normalization:
    source: inherited_capability_passed_representation_train_only
    fit_split: train
    freeze_after_fit: true
    refit_in_v6: false
    per_zone: true

model:
  representation_base_architecture: hybrid_cfc_transformer_moe_r4
  distributional_architecture_revision: continuous_distributional_world_r4_v6
  sequence_length: 96
  latent_width: 128
  parameter_budget:
    expected_min_trainable: 2500000
    expected_max_trainable: 4500000
    hard_stop_above_trainable: 5000000
  market:
    input_features: 16
    history_tokens: 7
    total_tokens: 103
    transformer_layers: 2
    attention_heads: 4
    feedforward_width: 384
    dropout: 0.1
  workload:
    input_features: [mean, std, p10, p50, p90]
    encoder: closed_form_liquid
    hidden_width: 128
    keep_all_tokens: true
  physical:
    frozen_twin_core: true
    input_features: 12
    hidden_width: 128
    residual_bound_fraction: 0.1
    dynamic_features: [pv_issue_mean_z4, pv_issue_std_z4, issue_utilization_z4]
  rolling_state:
    encoder: closed_form_liquid
    hidden_width: 128
    update_from_shield_executed_state: true
    empirical_migration: fixed_zero
  fusion:
    streams: [market, workload, physical, rolling_state]
    layers: 1
    attention_heads: 4
    feedforward_width: 256
  moe:
    experts: 8
    top_k: 2
    token_level: true
    expert_hidden_width: 256
    router_jitter_std_train: 0.05
    deterministic_eval: true
  forecasts:
    zonal_feature_count: 21
    outputs: {da: 4, rt: 4, dart: 4, workload: 1, pv: 4, pue: 4}
    exact_identity: rt = da - dart
    forward_closure_for_float_exactness: dart = da - rt
    bounded_neural_residual_raw_unit_fallback_caps: {da: 0.1, pv: 0.01, pue: 0.04}
  scenarios:
    count: 20
    compatibility_only: true
    formal_output_count_fixed: false
    scenario_code_width: 32
    decoder_hidden_width: 64
  distribution:
    representation_capacity_independent_of_sample_count: true
    continuous_residual_latent: true
    variable_sample_count: true
    policy_requires_samples: false
    center_source: capability_passed_representation_forecasts
    uncertainty_only_pretraining: true
    heteroscedastic_scale: true
    tail_state: true
    dependence_rank: 16
    regime_width: 32
    risk_latent_width: 64
    conditional_residual_transform: flow_matching_compatible_affine_tail_transform_v1
    exact_identity: rt = da - dart
    supports: {workload: nonnegative, pv: physical_bounds, pue: physical_bounds, prices: canonical_raw_envelope}
  risk:
    cvar_alpha: 0.95
    neural_outputs: [expected_cost_proxy, var95_proxy, cvar95_proxy, tail_risk_latent, stress_probability, uncertainty_latent]
    auxiliary_only: true
    formal_empirical_risk_requires_post_shield_replay: true
  policy:
    state_conditioned_per_origin: true
    hidden_width: 256
    residual_refinement_steps: 2
    reads: [distributional_world_latent, neural_risk_latent, rolling_physical_state, origin_time_state, legally_revealed_information]
    accepts_particle_tensor: false
    issue_day_ahead_at_origin: 0
    freeze_day_ahead_after_origin_zero: true
    empirical_migration: fixed_zero

sampling:
  train: 32
  cheap_validation: 64
  formal_probability: 256
  formal_empirical_risk: 512
  ablation: [20, 64, 128, 256, 512]
  fixed_rng_reproducible: true
  policy_inference_default_samples: 0

runtime:
  backend: deterministic_analytic_constraint_shield
  external_solver: false
  forbidden_active_imports: [pyomo, gurobipy, cvxpy, cvxpylayers, optnet]
  rolling_origins: 96
  execute_current_action_only: true
  independent_validator: true
  validation_tolerance: 1.0e-5
  constraint_shield: true
  empirical_migration: fixed_zero

training:
  optimizer: adamw
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  scheduler: cosine_with_linear_warmup
  warmup_fraction: 0.05
  mixed_precision: false
  physical_microbatch_days: 32
  physical_microbatch_fallback: [32, 16, 8, 4, 2, 1]
  optimizer_effective_batch_days: 543
  effective_batch_size_days: 543
  gradient_accumulation: one_step_per_complete_543_day_coverage_cycle
  every_coverage_cycle_uses_all_training_days_once: true
  unbiased_partial_tail_normalization: true
  preload_to_host_memory: true
  pinned_host_to_device_transfers: true
  windows_preload_worker_copies: 0
  fixed_training_cost_scale: train_price_aware_edf_median_absolute_daily_cost
  full_hard_validation_during_gradient_epochs: false
  cheap_validation_during_gradient_epochs: true
  phases:
    representation:
      mode: adopt_capability_passed_selected_checkpoint
      selected_epoch: 28
      trainable: false
    distribution:
      max_epochs: 200
      learning_rate: 2.0e-4
      train_samples: 32
      cheap_validation_samples: 64
      physical_microbatch_days: 32
      curriculum:
        - id: S1
          name: center_scale
          min_epochs: 10
          max_epochs: 30
          patience: 6
          min_delta: 1.0e-4
          loss_weights: {center_scale: 1.0, energy_score: 0.0, marginal_crps: 1.0, coverage90: 0.0, coverage95: 0.0, interval: 0.25, tail: 0.0, dependence: 0.0, diversity: 0.02, identity: 10.0}
        - id: S2
          name: coverage
          min_epochs: 10
          max_epochs: 35
          patience: 7
          min_delta: 1.0e-4
          loss_weights: {center_scale: 0.25, energy_score: 0.25, marginal_crps: 0.5, coverage90: 1.0, coverage95: 1.0, interval: 0.5, tail: 0.0, dependence: 0.0, diversity: 0.02, identity: 10.0}
        - id: S3
          name: tail
          min_epochs: 10
          max_epochs: 35
          patience: 7
          min_delta: 1.0e-4
          loss_weights: {center_scale: 0.10, energy_score: 0.25, marginal_crps: 0.5, coverage90: 0.25, coverage95: 0.75, interval: 0.25, tail: 1.0, dependence: 0.0, diversity: 0.02, identity: 10.0}
        - id: S4
          name: dependence
          min_epochs: 10
          max_epochs: 40
          patience: 8
          min_delta: 1.0e-4
          loss_weights: {center_scale: 0.10, energy_score: 0.75, marginal_crps: 0.5, coverage90: 0.25, coverage95: 0.5, interval: 0.25, tail: 0.5, dependence: 1.0, diversity: 0.05, identity: 10.0}
        - id: S5
          name: joint_proper_finetune
          min_epochs: 20
          max_epochs: 60
          patience: 12
          min_delta: 5.0e-5
          loss_weights: {center_scale: 0.25, energy_score: 1.0, marginal_crps: 1.0, coverage90: 0.5, coverage95: 0.75, interval: 0.25, tail: 0.75, dependence: 0.5, diversity: 0.05, identity: 10.0}
      candidate_selection:
        mode: top_k_pareto_scheduled
        top_k: 5
        scheduled_every_epochs: 10
        include_stage_end: true
        max_candidates: 16
        pareto_metrics: [energy_score, marginal_crps, coverage90_error, coverage95_error, tail, dependence]
        level2: full_frozen_179_day_distribution_gate
        level3: pass_only
        pass_rank: [energy_score_delta_one_sided_upper, marginal_crps, coverage95_error, tail_score_noninferiority_one_sided_upper, epoch]
    joint_policy:
      max_epochs: 320
      learning_rate: 1.0e-4
      preserve_distribution_proper_losses: true
      loss_weights: {distribution: 1.0, realized_cost: 1.0, risk: 0.25, sla: 10.0, shield_intervention: 1.0, router_balance: 0.02}
    a1:
      max_epochs: 120
      learning_rate: 5.0e-5
      definition: decision_focused_distribution_adaptation
      trainable_scope: rt_dart_scale_tail_selected_adapters_risk_bridge_preregistered_router
      loss_weights: {distribution: 1.0, realized_cost: 1.0, risk: 0.25, sla: 10.0, noninferiority: 1.0}
    a2:
      max_epochs: 180
      learning_rate: 3.0e-5
      definition: full_end_to_end_distributional_policy_optimization
      loss_weights: {distribution: 1.0, realized_cost: 1.0, risk: 0.25, sla: 10.0, shield_intervention: 1.0, router_balance: 0.02}

capability_gates:
  common:
    validation_dates_expected: 179
    persist_daily_rows: true
    bootstrap: {block_days: 7, replicates: 10000, confidence: 0.95, seed: 20240813}
  distribution:
    baseline: frozen_training_residual_sampling
    formal_sample_count: 256
    formal_empirical_risk_samples: 512
    primary_metric: energy_score
    primary_paired_upper_ci_strictly_below_zero: true
    marginal_crps_required: true
    coverage_levels: [0.90, 0.95]
    max_absolute_coverage_error: 0.03
    interval_score_required: true
    tail_noninferiority_margin_fraction: 0.01
    dependence_noninferiority_margin_fraction: 0.01
    require_identity_tolerance: 1.0e-6
    require_revealed_prefix_identity: true
    require_no_future_leakage: true
    require_support_bounds: true
    require_finite: true
    require_non_degenerate_samples: true
    minimum_effective_sample_fraction: 0.95
  joint_policy:
    validation_days: 179
    validation_origins: 17184
    feasibility_fraction: 1.0
    maximum_non_exogenous_rejected_origins: 0
    maximum_normalized_sla_increase: 0.001
    paired_daily_cost_upper_ci_at_most_zero: true
    require_policy_independent_of_sample_count: true
  a1:
    require_probabilistic_noninferiority: true
    require_realized_decision_noninferiority: true
    require_exact_gradient_allowlist: true
    require_frozen_hashes_unchanged: true
    require_no_future_leakage: true
  a2:
    inherit_full_distribution_and_policy_gates_without_relaxation: true

audit:
  hash_policy: freeze_once_then_manifest_compare
  full_gate_frequency: level2_candidates_only
  hash_large_checkpoint: once_at_candidate_write
  repeat_full_corpus_hash_each_epoch: false
  repeat_full_gate_each_epoch: false

artifacts:
  root: artifacts/e2e_moe_distributional_r4_v6_formal
  runtime_log: runtime.log
  preserve_v5_failure_history: true
