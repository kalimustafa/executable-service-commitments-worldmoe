selection_freeze_contract:
  freeze_before_reading_selection_outcomes: true
  feasibility_precedes_statistical_ranking: true
  mcs_precedes_lcb_selection: true
  daily_three_seed_average_precedes_bootstrap: true
  common_bootstrap_indices_across_candidates: true
  primary_loss_orientation: lower_realized_operating_cost_or_regret_is_better
  primary_value_orientation: higher_incremental_operational_value_is_better
  primary_lcb_definition: percentile_0_05_of_paired_7_day_block_bootstrap_mean_daily_incremental_value
  A2_is_primary_selection_experiment: true
  A1_is_noninferiority_safety_gate_not_primary_ranking: true
  A1_epsilon_fraction_of_mean_baseline_daily_cost: 0.005
  economic_winner_tolerance_fraction_of_mean_baseline_daily_cost: 0.005
  robustness_lcb_definitions:
    - percentile_0_05_of_paired_14_day_block_bootstrap_mean_daily_incremental_value
    - percentile_0_05_of_paired_28_day_block_bootstrap_mean_daily_incremental_value
  mcs_and_lcb_use_same_exact_daily_panel: true
  selector_comparators_use_same_replay_table: true
  null_or_no_feasible_flexibility_days_remain_in_denominator_audit: true
  winner_set_retained_before_tie_break_reporting: true
  tie_break_does_not_convert_statistical_indistinguishability_into_a_causal_claim: true
  conventional_and_value_select_primary_comparison:
    conventional: minimum_MAE_with_CRPS_only_as_deterministic_tie_break
    proposed: feasibility_plus_A1_noninferiority_plus_95_percent_MCS_plus_A2_7_day_LCB
    locked_table: same_2025_A2_replay_rows_no_new_solve

hypothesis_contract:
  frozen_before_v1_and_dart_selection_results: true
  H4a_material_rank_disagreement:
    top_choice_disagreement_required: true
    normalized_kendall_distance_definition: discordant_candidate_pairs_divided_by_total_candidate_pairs
    minimum_normalized_kendall_distance: 0.20
    counterfactual_value_gap_definition: absolute_mean_daily_value_gap_divided_by_positive_baseline_operating_cost
    minimum_counterfactual_value_gap_fraction: 0.001
    all_three_conditions_required: true
  H4b_conservative_set_valued_dominance:
    target_policy: frozen_pre_tie_winner_set
    comparison_policy: every_target_member_against_every_feasible_comparator_member
    all_target_members_must_be_feasible: true
    infeasible_comparator_policy: disclose_and_do_not_count_as_dominance_evidence
    value_difference_orientation: target_minus_comparator
    regret_difference_orientation: comparator_minus_target
    support_rule: every_paired_value_and_regret_7_day_block_bootstrap_lcb_strictly_above_zero
    statistic_name: conservative_set_valued_selection_advantage_CSSA
    formula: Q_0_05_of_each_common_block_bootstrap_replicates_minimum_over_i_in_target_set_j_in_comparator_set_of_mean_daily_value_i_minus_j
    block_days_primary: 7
    block_days_robustness: [14, 28]
    confidence_level: 0.95
    resamples: 2000
    seed: 20260809
    primary_comparator: MAE-Select
    same_locked_A2_replay_table_required: true
    no_new_solve: true
    positive_result_required_for_completion: false
  H4c_incremental_explanatory_test:
    unit: selection_oos_candidate_day
    years: [2022, 2023, 2024]
    validation: rolling_forward_blocked_cross_validation
    folds: 6
    repeats: 3
    repeat_seeds: [20260809, 20260819, 20260829]
    point_error_features: [mae, rmse]
    incremental_features: [tail_crps, tail_calibration_error, economic_action_brier, action_f1, forl]
    response: daily_counterfactual_incremental_operational_value
    improvement_score: paired_out_of_sample_squared_error_point_error_only_minus_augmented
    support_rule: paired_7_day_block_bootstrap_lcb_of_improvement_strictly_above_zero
    block_days: 7
    confidence_level: 0.95
    resamples: 2000
    seed: 20260809
  A3_date_level_contradiction:
    required_grain: operating_date_candidate_experiment
    required_context: [spike, dart_sign, feasible_flexibility, binding_constraint, regime]
    contradiction_rule: lowest_mae_or_crps_or_highest_q99_tail_f1_model_differs_from_highest_A2_decision_value_model
    explicit_null_status: NO_QUALIFYING_CONTRADICTION
    null_finding_must_be_retained: true

locked_test_exposure_disclosure:
  preexisting_auxiliary_v1_2025_results_may_exist: true
  formal_dart_code_may_not_read_v1_2025_metric_values: true
  formal_dart_selector_may_not_consume_v1_2025_predictions_or_metrics: true
  algorithmic_loader_nonconsumption_is_the_only_blindness_claim: true
  no_prior_human_exposure_claimed: true
  locked_2025_status: post_amendment_algorithmically_once_locked
  original_human_blindness_claimed: false
  required_paper_disclosure: DART_2025_is_algorithmically_once_locked_after_the_protocol_amendment_but_prior_auxiliary_v1_2025_results_existed

required_outputs:
  mandatory_artifact_count_policy: derive_dynamically_from_mandatory_artifact_registry
  hard_coded_pre_patch_mandatory_artifact_count_forbidden: true
  all_listed_dart_outputs_are_mandatory_in_paper_mode: true
  tables:
    - artifacts/tables/dart_probability_quality.csv
    - artifacts/tables/dart_decision_value.csv
    - artifacts/tables/dart_selection_methods.csv
    - artifacts/tables/dart_regime_value.csv
  figures:
    - artifacts/figures/dart_accuracy_value_contradiction.png
    - artifacts/figures/dart_value_selection_lcb.png
  manifests:
    - artifacts/manifests/dart_value_select_manifest.json
    - artifacts/manifests/dart_replay_manifest.json
    - artifacts/manifests/dart_statistical_selection_manifest.json
