schema_version: dcvpp.dart_value_select.v12
name: DART-ValueSelect
frozen: true
freeze_before_first_rolling_origin: 2022-01-01T00:00:00Z
selection_scope: rolling_sample_out_of_decision_counterfactual_operational_value
protocol_amendment:
  effective_date: 2026-08-11
  amendment: replace_prior_confirmatory_panels_with_three_seed_panel_before_formal_dart_training
  confirmatory_study_seeds: [20260809, 20260819, 20260829]
  excluded_legacy_seeds: [20260908, 20260918]
  excluded_seed_20260908_role: completed_v1_auxiliary_retained_but_excluded_from_all_subsequent_confirmatory_experiments
  excluded_seed_20260918_role: never_started_for_pending_cfc_or_formal_dart
  prior_artifact_policy: retain_and_label_legacy_pre_amendment_excluded_from_confirmatory_three_seed_panel
  amended_dart_annual_training_units:
    neural: 144
    lightgbm: 8
    deterministic: 16
    total: 168
  amended_dart_top_level_replay_cells:
    selection: 59184
    locked_2025: 19710
    shared_baseline: 4383
    perfect_information: 1461
    total: 84738
  decision_value_selection_amendment:
    amendment: replace_score_only_or_A1_primary_selection_with_common_quality_audit_and_A2_decision_value_selection_subject_to_A1_noninferiority
    evidence_trigger: auxiliary_first_round_validation_audit_only
    formal_dart_training_started_before_amendment: false
    formal_dart_replay_started_before_amendment: false
    locked_2025_dart_results_read_before_amendment: false
    main_paper_comparison: [minimum_mae_select, DART-ValueSelect]
    supplementary_diagnostics: [minimum_crps_select, q99_tail_f1_select, mean_validation_value_select]
    arbitrary_weighted_composite_score_forbidden: true
  checkpoint_selection_amendment:
    amendment: replace_single_seed_minimum_validation_pinball_checkpoint_with_three_seed_hierarchical_epoch_confidence_set
    evidence_trigger: auxiliary_first_round_validation_audit_only
    formal_dart_training_started_before_amendment: false
    formal_dart_replay_started_before_amendment: false
    locked_2025_dart_results_read_before_amendment: false
    outer_DART_ValueSelect_changed: false
  anchor_only_checkpoint_amendment:
    effective_date: 2026-08-12
    amendment: restrict_all_provisional_and_final_neural_epoch_candidates_to_exact_common_persisted_five_epoch_anchors
    evidence_trigger: fail_closed_cuda_selected_epoch_replay_nondeterminism_before_any_oos_materialization
    performance_independent: true
    formal_dart_training_anchors_existed_before_amendment: true
    formal_dart_completed_oos_units_before_amendment: 0
    formal_dart_replay_started_before_amendment: false
    locked_2025_dart_results_read_before_amendment: false
    market_value_milp_or_action_metrics_consumed: false
    model_architecture_loss_hyperparameters_data_splits_and_seeds_changed: false
    outer_DART_ValueSelect_changed: false
    superseded_forecast_run_id: paper-dart-forecast-v3
    replacement_forecast_run_id: paper-dart-forecast-v4

sign_contract:
  canonical_dart_field: dart_da_minus_rt
  inverse_spread_field: rt_spread_rt_minus_da
  canonical_dart_formula: da_lbmp - rt_lbmp
  inverse_spread_formula: rt_lbmp - da_lbmp
  bare_rt_spread_field_forbidden: true
  gate: np.allclose(dart_da_minus_rt, -rt_spread_rt_minus_da, equal_nan=True)
  positive_dart_semantics: da_more_expensive_decrease_da_procurement_minus_1_when_feasible
  negative_dart_semantics: rt_more_expensive_increase_da_procurement_plus_1_when_feasible

optimization_runtime:
  solver: appsi_highs
  interval_hours: 0.25
  solver_threads: 1
  time_limit_seconds: 600
  mip_relative_gap: 0.0
  mip_relative_gap_role: solve_toward_proven_optimality_not_admission_cap
  feasible_mip_start: all_short_home_no_migration_zero_storage_v1

candidate_contract:
  frozen_deployable_pool:
    - seasonal_naive
    - persistence
    - lightgbm_quantile
    - lstm
    - dlinear
    - patchtst
    - itransformer
    - static_graph_patch_transformer
    - dgpt_e
  exact_pool_required: true
  excluded_oracles:
    - oracle_future_realized_weather
    - ORACLE_POSTHOC_SELECTOR
    - perfect_information
  oracle_exclusion_reason: unavailable_at_gate_or_unattainable_upper_bound_only
  tft:
    included_in_frozen_pool: false
    status: EXCLUDED_OPTIONAL_MODEL
    disclosure_required: true
    disclosure: optional_TFT_is_not_a_preregistered_deployable_candidate_and_must_not_be_listed_as_completed

execution_order:
  schema_version: dcvpp.dart_execution_order.v1
  frozen_before_formal_dart_training: true
  decision_basis: user_specified_resource_sequence_not_candidate_performance
  immediate_phase: formal_full_date_main_and_control_candidate_training
  immediate_candidate_pool: [seasonal_naive, persistence, lightgbm_quantile, lstm, dlinear, patchtst, itransformer, static_graph_patch_transformer, dgpt_e]
  exact_frozen_nine_candidate_pool_required: true
  all_rolling_origins_and_dates_required: true
  ablations_deferred_until_immediate_phase_complete: true
  oracle_variants_deferred_until_immediate_phase_complete: true
  deferred_families: [ablations, ORACLE_variants]
  deferred_families_excluded_from_immediate_run: true
  oracle_variants_deployable: false
  performance_informed_reordering_forbidden: true

randomization_contract:
  study_seeds: [20260809, 20260819, 20260829]
  decision_replay_seed_slots:
    - {slot: 0, study_seed: 20260809}
    - {slot: 1, study_seed: 20260819}
    - {slot: 2, study_seed: 20260829}
  deterministic_seed_slots:
    - {slot: 0, study_seed: 20260809}
    - {slot: 1, study_seed: 20260819}
    - {slot: 2, study_seed: 20260829}
  deterministic_seed_slots_legacy_alias_role: decision_replay_slots_not_forecast_refit_requirements
  forecast_training_seed_roles:
    deterministic_one_fit: [seasonal_naive, persistence]
    statistical_fixed_one_fit: [lightgbm_quantile]
    neural_three_fit: [lstm, dlinear, patchtst, itransformer, static_graph_patch_transformer, dgpt_e]
  forecast_fit_policy:
    deterministic_one_fit: no_redundant_random_refits
    statistical_fixed_one_fit: fixed_seed_20260809
    neural_three_fit: exact_three_study_seeds_all_completed
  decision_replay_seed_contract:
    study_seeds: [20260809, 20260819, 20260829]
    candidate_pool: [seasonal_naive, persistence, lightgbm_quantile, lstm, dlinear, patchtst, itransformer, static_graph_patch_transformer, dgpt_e]
    every_candidate_uses_all_three_seed_slots: true
    deterministic_and_statistical_forecasts_are_reused_across_replay_slots: true
    candidate_name_may_not_change_replay_seed_slot: true

forecast_issue_contract:
  profile_id: COMMON_DA_GATE_DART_V1
  comparison_gate: nyiso_day_ahead_market_gate
  day_ahead_target_profile: da_lbmp_issued_at_common_da_gate
  real_time_target_profile: rt_lbmp_distribution_issued_at_same_da_gate
  both_targets_share_identical_information_cutoff: true
  later_intraday_rt_updates_forbidden_in_selection_comparison: true
  quantiles: [0.05, 0.10, 0.50, 0.90, 0.95]
  unified_candidate_comparison_contract:
    exact_common_date_zone_origin_panel: true
    exact_common_missing_value_mask: true
    exact_common_da_rt_information_clock: true
    exact_common_calibration_panel: true
    exact_common_three_replay_seed_panel: true
    exact_common_test_target_hash: true
    common_issue_time_panel_sha256_required: true
    common_calibration_panel_sha256_required: true
    candidate_specific_or_partition_specific_event_threshold_forbidden: true

chronology:
  initial_training_through_year: 2021
  selection_years: [2022, 2023, 2024]
  expanding_window: true
  selection_evidence: rolling_origin_sample_out_of_sample_only
  annual_expanding_fit_origins:
    - {evaluation_year: 2022, fit_through: 2021-12-31T23:59:59Z}
    - {evaluation_year: 2023, fit_through: 2022-12-31T23:59:59Z}
    - {evaluation_year: 2024, fit_through: 2023-12-31T23:59:59Z}
  final_refit_and_freeze_through_year: 2024
  locked_test_year: 2025
  locked_test_runs: 1
  locked_test_may_update_selector: false
  freeze_before_locked_test:
    - model_forms_and_refit_rules
    - hyperparameters_and_checkpoints
    - calibration
    - action_thresholds
    - risk_budgets
    - static_and_contextual_selectors
    - user_and_twin_parameters
    - scenario_counts_reduction_and_seeds
    - optimizer_and_solver_limits
    - statistical_rules
  locked_once_only_guard:
    namespace: dart_value_select.locked_test.2025.v2
    run_id_template: dart-locked-2025-{frozen_fingerprint_sha256_first_16}
    fingerprint_algorithm: sha256
    fingerprint_components:
      - frozen_dart_value_select_config
      - exact_candidate_pool_and_seed_slots
      - model_checkpoint_or_refit_rule_hashes
      - calibration_and_action_threshold_hashes
      - user_twin_and_baseline_hashes
      - scenario_seed_count_reduction_hashes
      - optimizer_solver_and_statistical_rule_hashes
    once_guard_key_formula: sha256(namespace|run_id|frozen_fingerprint)
    reject_existing_namespace_run: true
    reject_changed_fingerprint: true
    second_locked_test_run_forbidden: true

checkpoint_selection:
  schema_version: dcvpp.dart_checkpoint_selection_policy.v12
  scope: within_model_neural_epoch_selection_only
  applies_to: [lstm, dlinear, patchtst, itransformer, static_graph_patch_transformer, dgpt_e]
  applies_separately_by: [annual_origin, target_head]
  study_seeds: [20260809, 20260819, 20260829]
  candidate_epoch_grid:
    source: exact_common_persisted_training_anchors
    applies_to: [provisional_assessment, final_selection]
    anchor_interval_epochs: 5
    positive_epoch_required: true
    exact_anchor_required_for_all_three_seeds: true
    eligible_epoch_formula: E_A_intersection_of_positive_epochs_divisible_by_5_with_hash_verified_persisted_anchor_for_each_study_seed
    non_anchor_epoch_records_role: audit_only_not_selection_candidates
    selected_checkpoint_source: exact_persisted_anchor_payload_no_replay_training
    between_anchor_replay_forbidden: true
    earliest_surviving_anchor_tie_rule: true
  neural_training:
    maximum_epoch_count: 100
    minimum_epoch_count: 40
    every_completed_epoch_recorded: true
    v4_every_completed_epoch_full_immutable_checkpoint_required: true
    v4_full_epoch_checkpoint_interval_epochs: 1
    v4_full_epoch_checkpoint_required_state:
      - model_state
      - optimizer_state
      - gradient_scaler_state
      - python_numpy_torch_and_cuda_rng_state
      - dataloader_generator_and_sampler_state
      - training_health_record
      - validation_epoch_ledger
    v4_full_epoch_checkpoint_must_be_hash_pinned_and_append_only: true
    v4_non_five_epoch_checkpoint_selection_role: audit_and_resume_only_not_formal_selection_candidate
    v3_source_checkpoint_cadence_unchanged: true
    individual_seed_early_stopping_selects_final_checkpoint: false
    common_epoch_required_across_exact_three_seeds: true
    synchronized_three_seed_group_early_stopping: true
    provisional_assessment_interval_epochs: 5
    provisional_bootstrap_resamples: 200
    required_consecutive_stable_assessments: 3
    minimum_stability_span_epochs: 15
    stable_assessment_requires_unchanged:
      - provisional_selected_epoch
      - global_crps_confidence_set
      - proper_tail_twcrps_confidence_set
      - selected_epoch_health_status
      - selected_epoch_simultaneous_80_90_coverage_status
    maximum_best_mean_global_crps_improvement_for_stability: 1.0e-8
    maximum_best_mean_proper_tail_twcrps_improvement_for_stability: 1.0e-8
    stop_all_three_seeds_together: true
    final_selection_uses_exact_common_persisted_anchor_panel: true
    provisional_selection_uses_exact_common_persisted_anchor_panel: true
    cross_model_scheduler:
      strategy: warmup_each_group_to_40_then_global_assessment_then_active_groups_in_10_epoch_rounds
      scheduling_basis: efficiency_not_candidate_performance
      group_definition: candidate_by_annual_origin_by_target_head_exact_three_seed_group
      strict_cross_model_rotation_every_5_epochs: false
      warmup_target_epoch: 40
      every_group_reaches_warmup_target_before_first_global_assessment: true
      active_group_round_increment_epochs: 10
      active_group_definition: group_not_stopped_by_frozen_synchronized_three_seed_rule
      all_active_groups_receive_one_increment_before_next_global_assessment: true
      within_group_ledger_interval_epochs: 5
      within_group_provisional_assessment_interval_epochs: 5
      global_assessment_and_summary_epochs: [40, 50, 60, 70, 80, 90, 100]
      stop_decisions_materialized_only_at_global_round_boundaries: true
      stable_groups_skipped_in_later_rounds: true
      maximum_epoch_count: 100
      individual_seed_scheduling_or_stopping_forbidden: true
  pre_cutoff_internal_holdout:
    total_days: 112
    checkpoint_calibration_days: 56
    checkpoint_selection_days: 28
    final_calibration_and_coupling_days: 28
    chronological_order: [core_training, checkpoint_calibration, checkpoint_selection, final_calibration_and_coupling, annual_cutoff]
    every_panel_strictly_before_annual_cutoff: true
    panel_overlap_forbidden: true
    core_training_uses_all_earlier_eligible_history: true
  tail_thresholds:
    quantiles: [0.01, 0.05, 0.95, 0.99]
    source: core_training_history_only
    scope: per_annual_origin_target_and_nyiso_zone_common_across_epochs_seeds_and_candidates
    contract_sha256_required: true
  epoch_health_gate:
    finite_training_loss_required: true
    finite_gradient_diagnostics_required: true
    finite_predictions_required: true
    nonfinite_gradient_step_count_required: 0
    maximum_raw_quantile_crossing_rate: 0.05
    post_calibration_quantile_crossing_count_required: 0
  simultaneous_coverage_gate:
    nominal_levels: [0.80, 0.90]
    maximum_absolute_coverage_error: 0.05
    simultaneous_across_levels: true
  score_confidence_sets:
    ordered_scores: [global_crps, proper_q01_q05_q95_q99_threshold_weighted_crps]
    global_score: crps_from_common_quantile_grid
    tail_score: proper_q01_q05_q95_q99_threshold_weighted_crps
    arbitrary_weighted_composite_forbidden: true
    lower_is_better: true
  inference:
    seed_aggregation: within_operating_date_mean_across_exact_three_seeds
    seed_values_are_not_independent_date_samples: true
    confidence_level: 0.95
    bootstrap: circular_moving_block
    block_length_days: 7
    resamples: 1000
    seed: 20260809
    simultaneous_one_sided_confidence_sets: true
    exact_common_epoch_and_date_panel_required: true
  selection_order:
    - epoch_health_gate
    - simultaneous_80_90_coverage_gate
    - global_crps_epoch_confidence_set
    - proper_q01_q05_q95_q99_twcrps_epoch_confidence_set
    - earliest_surviving_epoch
  tie_rule: earliest_epoch
  empty_set_policy: fail_annual_origin_target_candidate_cell_closed
  forbidden_inputs:
    - action_metrics
    - MILP_outputs
    - operating_cost
    - profit
    - regret
    - CVaR
    - rolling_evaluation_year_OOS_outcomes
    - locked_2025_targets_predictions_or_metrics
  outer_selection_contract:
    unchanged: true
    minimum_MAE_comparator_unchanged: true
    DART_ValueSelect_A2_primary_A1_noninferiority_unchanged: true

probabilistic_credibility:
  selects_final_winner_alone: false
  metrics:
    - mae
    - rmse
    - crps
    - pinball_loss
    - proper_positive_and_negative_threshold_weighted_crps
    - interval_coverage_80_90
    - interval_width_80_90
    - absolute_calibration_error_80_90
    - pit_or_quantile_calibration_error
    - q99_event_brier
    - q99_event_pooled_panel_pr_auc
    - q99_event_precision_recall_f1_and_miss_rate
    - positive_and_negative_exceedance_calibration
    - energy_score
    - variogram_score
    - temporal_autocorrelation_error
    - cross_zone_rank_correlation_error
    - spike_duration_error
    - joint_spike_frequency_error
  tail_threshold_source: current_rolling_origin_training_history_only
  tail_threshold_scope: per_evaluation_year_and_nyiso_zone_common_across_candidates
  tail_quantiles: [0.01, 0.05, 0.95, 0.99]
  tail_threshold_contract_sha256_required: true
  threshold_weighted_crps_definition: integral_w_u_times_F_u_minus_indicator_y_le_u_squared_du
  threshold_weighted_crps_weight: indicator_u_le_zone_q05_plus_indicator_u_ge_zone_q95_plus_indicator_u_le_zone_q01_plus_indicator_u_ge_zone_q99
  q01_q99_threshold_role: common_extreme_event_definition_and_extra_tail_emphasis
  legacy_realized_outcome_reweighted_crps_role: auxiliary_nonproper_diagnostic_only
  global_strict_credibility_score: crps
  threshold_weighted_score_claim: proper_local_tail_score_not_global_strict_score
  quantile_levels: [0.05, 0.10, 0.50, 0.90, 0.95]

actionability:
  selects_final_winner_alone: false
  physical_flexible_energy_field: gate_time_feasible_flexible_energy_mwh
  feasible_flexibility_field: gate_time_candidate_independent_feasibility_weight
  feasible_flexibility_range: [0.0, 1.0]
  feasible_flexibility_normalization: frozen_common_gate_time_capacity_normalization
  candidate_independent_feasibility_hash_required: true
  feasible_flexibility_sources:
    - available_task_queue
    - task_deadlines
    - server_capacity
    - current_battery_soc_and_power_limits
    - migration_eligibility_and_bandwidth
    - other_declared_gate_time_constraints
  forbidden_feasible_flexibility_inputs:
    - future_realized_price
    - future_realized_workload
    - future_realized_pv
    - locked_test_outcome
  awcrps_formula: sum(F * proper_threshold_weighted_CRPS) / sum(F)
  zero_awcrps_denominator_value: null
  zero_awcrps_denominator_status: NO_FEASIBLE_FLEXIBILITY
  action_class_order: [-1, 0, 1]
  action_semantics:
    -1: decrease_da_procurement_inc_like_demand_side_action
    0: no_action_inside_time_varying_cost_band
    1: increase_da_procurement_dec_like_demand_side_action
  no_action_band_components:
    - battery_degradation_cost
    - migration_energy_and_bandwidth_cost
    - transaction_cost
    - engineered_sla_risk
    - minimum_dispatch_quantity
    - settlement_asymmetry
  universal_usd_per_mwh_threshold_primary: false
  metrics:
    - multiclass_economic_action_brier
    - feasible_flexibility_weighted_precision
    - feasible_flexibility_weighted_recall
    - feasible_flexibility_weighted_f1
    - wrong_action_rate
    - wrong_action_economic_loss_usd
    - missed_opportunity_rate
    - missed_opportunity_economic_loss_usd
    - q99_spike_pr_auc
    - feasible_opportunity_ranking_loss
  forl_formula: sum(F_a * abs(G_a) * indicator(G_hat_a * G_a < 0)) / sum(F_a * abs(G_a))
  realized_net_gain_definition: realized_DART_net_of_frozen_time_varying_no_action_band
  predicted_net_gain_definition: candidate_predictive_net_gain_net_of_same_frozen_no_action_band
  forl_realized_gain_usage: post_decision_scoring_only
  zero_forl_denominator_value: null
  zero_forl_denominator_status: NO_FEASIBLE_OPPORTUNITY

decision_value:
  primary_ranking: true
  selection_metric: profit_lcb
  selection_metric_semantics: counterfactual_incremental_operational_value_lcb_not_commercial_profit
  realized_replay_timing: freeze_DA_schedule_before_operating_day_then_reveal_only_current_15_minute_price_and_physical_state
  future_price_workload_pv_and_physical_state_remain_hidden: true
  counterfactual: true
  evidence_role: counterfactual_replayed
  task_value_policy: invariant_or_explicit_engineering_assumption_only
  realized_operational_value_components:
    - day_ahead_settlement_cost
    - real_time_deviation_settlement_cost
    - battery_degradation_cost
    - migration_cost
    - sla_penalty
    - transaction_cost
    - other_cost
  incremental_value_formula: Pi_real_model - Pi_real_baseline
  prescriptive_regret_formula: Pi_perfect_information - Pi_real_model
  profit_capture_ratio_formula: sum(Pi_real_model - Pi_real_baseline) / sum(Pi_perfect_information - Pi_real_baseline)
  pcr_null_when_denominator_nonpositive_or_numerically_zero: true
  perfect_information_label: UNATTAINABLE_UPPER_BOUND_ONLY
  perfect_information_deployable: false
  risk_alpha: 0.95
  metrics:
    - cumulative_and_mean_incremental_operational_value
    - equivalent_operating_cost_reduction_and_rate
    - value_per_mwh_feasible_flexibility
    - prescriptive_regret
    - profit_capture_ratio
    - probability_below_baseline
    - cvar_0_95_of_negative_incremental_value
    - worst_5_percent_mean_loss
    - maximum_drawdown
    - maximum_daily_loss
    - longest_loss_run
    - positive_day_share

identical_replay:
  common_user_and_twin_parameters: true
  common_initial_soc_and_task_queue: true
  common_sla_mapping_and_migration_constraints: true
  common_raw_and_reduced_scenario_counts: true
  common_scenario_reduction_method: true
  common_scenario_seeds: true
  common_stochastic_milp: true
  common_solver_time_limit_and_mip_gap: true
  common_rolling_update_rules: true
  common_realized_replay_path: true
  common_validation_day_denominator: true
  hash_mismatch_invalidates_pairing: true

decision_pipeline_contract:
  optimization_policy_id: B6
  raw_scenario_count: 100
  reduced_scenario_count: 20
  common_uniform_draws_across_candidates: true
  common_scenario_seeds_across_candidates: true
  scenario_seed_slot_source: randomization_contract.decision_replay_seed_slots
  common_reduction_algorithm_across_candidates: true
  common_reduction_budget_across_candidates: true
  reduction_budget: 20
  candidate_distribution_transforms_common_uniforms: true
  preregistered_baseline:
    baseline_id: DART_BASELINE_B6_SEASONAL_NAIVE_V1
    forecast_source: seasonal_naive
    optimization_policy_id: B6
    candidate_independent: true
    one_common_baseline_value_per_day_seed_and_replay: true
    baseline_may_not_be_recomputed_to_favor_a_candidate: true

feasibility:
  minimum_sla_satisfaction: 0.99
  minimum_sla_satisfaction_role: preregistered_engineering_assumption
  cvar95_loss_budget_fraction_of_baseline_cost: 0.05
  cvar95_loss_budget_role: preregistered_engineering_assumption
  maximum_probability_below_baseline: 0.50
  maximum_probability_below_baseline_role: preregistered_engineering_assumption
  market_gate_budget_seconds: 3600
  market_gate_budget_role: preregistered_engineering_assumption
  require_zero_infeasible_days: true
  require_zero_invalid_days: true
  maximum_solver_relative_mip_gap: 0.05
  require_solver_incumbent: true
  require_finite_reported_solver_gap: true
  require_zero_solver_gap_over_cap_days: true
  require_zero_solver_missing_gap_days: true
  require_zero_solver_no_incumbent_days: true
  solver_timeout_day_field: solver_timeout_days
  solver_nonzero_gap_day_field: solver_nonzero_gap_days
  solver_gap_over_cap_day_field: solver_gap_over_cap_days
  solver_missing_gap_day_field: solver_missing_gap_days
  solver_no_incumbent_day_field: solver_no_incumbent_days
  solver_feasibility_rule: incumbent_required_and_finite_relative_mip_gap_le_0_05
  feasible_timeout_policy: accepted_only_with_incumbent_and_finite_relative_mip_gap_le_0_05
  timeout_days_are_disclosed_but_not_automatically_excluded: true
  nonzero_gap_days_are_disclosed_but_not_automatically_excluded: true
  rejected_solver_outcomes:
    - gap_strictly_greater_than_0_05
    - missing_or_nonfinite_gap
    - no_incumbent
    - infeasible_or_nonfeasible_termination
  bounded_gap_value_reporting:
    primary_A1_A2_estimand: exact_ex_post_settlement_cost_of_executed_incumbent_actions
    primary_estimand_uses_solver_bounds: false
    supplementary_certificate_formula: baseline_planner_objective_lower_bound_minus_candidate_planner_objective_upper_bound
    missing_explicit_planner_bound_policy: null_never_infer_or_fabricate
    certificate_scope: issue_time_planner_objective_not_realized_settlement_value
  timeout_and_gap_grain: operating_date_with_any_of_three_replay_seeds_flagged
  timeout_nonzero_over_cap_missing_gap_no_incumbent_days_remain_disclosed: true

bootstrap:
  method: paired_circular_moving_block
  confidence_level: 0.95
  lower_confidence_bound_quantile: 0.05
  blocks_days: [7, 14, 28]
  primary_block_days: 7
  robustness_block_days: [14, 28]
  common_indices_across_models: true
  preserve_weekly_and_value_autocorrelation: true
  resamples: 2000
  seed: 20260809

model_confidence_set:
  enabled: true
  confidence_level: 0.95
  primary_block_days: 7
  resamples: 2000
  seed: 20260809
  loss_series: daily_realized_operating_cost_or_prescriptive_regret
  statistic: centered_studentized_global_loss_range
  null_hypothesis: equal_predictive_ability_over_all_surviving_pairwise_loss_differentials
  bootstrap_centering: observed_pairwise_mean_loss_differentials
  studentization: pairwise_moving_block_bootstrap_standard_error
  range_definition: maximum_absolute_studentized_pairwise_loss_differential
  elimination_rule: remove_current_highest_standardized_loss_only_after_global_null_rejection
  sequential_step_down: true
  eliminated_model_p_value: running_maximum_global_null_p_value_at_elimination
  included_model_p_value: 1.0
  apply_before_maximum_lcb: true
  uncorrected_pairwise_tests_forbidden: true

selection:
  primary_experiment: A2_full_deployment_chain
  candidate_pool: feasible_intersection_A1_noninferior_intersection_model_confidence_set
  objective: maximum_A2_primary_7_day_lcb
  point_error_selects_final_winner: false
  A1_noninferiority:
    required: true
    lcb_definition: A1_primary_7_day_moving_block_bootstrap_lcb
    epsilon_fraction_of_mean_baseline_daily_cost: 0.005
    rule: A1_LCB_greater_than_or_equal_to_negative_epsilon
    checked_before_A2_winner_set: true
  winner_economic_tolerance_fraction_of_mean_baseline_daily_cost: 0.005
  winner_set_rule: retain_every_eligible_A2_MCS_member_with_LCB_within_economic_tolerance_of_best_LCB
  lcb_absolute_tolerance: 1.0e-9
  lcb_relative_tolerance: 1.0e-9
  tie_tolerance:
    rule: abs_difference_le_absolute_plus_relative_times_max_abs_or_one
    absolute: 1.0e-9
    relative: 1.0e-9
    frozen_before_2022: true
  diagnostic_tie_order_report_only:
    - lower_prescriptive_regret
    - better_tail_calibration
    - lower_forecast_plus_solve_latency
    - lower_model_complexity
  report_selected_model_separately_from_winner_set: true
  no_forced_winner_when_indistinguishable: true
  indistinguishable_status: STATISTICALLY_INDISTINGUISHABLE_WINNER_SET

experiments:
