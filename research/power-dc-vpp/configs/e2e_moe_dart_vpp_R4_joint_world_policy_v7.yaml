schema_version: dcvpp.e2e_moe_joint_world_policy_r4.v7

project:
  version: R4-V7
  architecture_name: Baseline-Anchored-Joint-World-Policy-Top2MoE-DART-VPP
  architecture_version: baseline_anchored_joint_world_policy_moe_r4_v7
  implementation_namespace: dcvpp.e2e_moe_r4_v7
  experiment_id: e2e_moe_joint_world_policy_r4_v7_2025final_seed1
  output_root: artifacts/e2e_moe_joint_world_policy_r4_v7_2025final
  preserve_predecessor_lineages_read_only: true

protocol:
  active_seed: 20240813
  seeds: [20240813, 20240829, 20240917]
  phase_order: [d0, p0, j1, j2, j3, calibration_restore, a1, a2]
  continue_after_seed1_only_on: R4_V7_MAINLINE_PASS
  splits:
    train:
      start: "2022-01-01"
      end: "2023-12-31"
      days: 722
      role: development_fit
    validation:
      start: "2024-01-01"
      end: "2024-12-31"
      days: 364
      role: development_validation
    trainval_refit:
      start: "2022-01-01"
      end: "2024-12-31"
      days: 1086
      role: frozen_method_refit
      allowed_only_after_method_selection: true
    final_test:
      start: "2025-01-01"
      end: "2025-12-31"
      calendar_days: 365
      days: 362
      evaluable_days: 362
      settlement_complete_days: 362
      forecast_quality_scorable_days: 328
      current_v7_ready_days: 0
      missing_or_pending_days: 3
      missing_day_status: pending_v7_materialization
      official_settlement_missing_dates: ["2025-05-27", "2025-05-28", "2025-11-12"]
      v7_materialization_status: sealed_pending_method_freeze
      role: unique_final_test
      sealed_until_all_methods_frozen: true
      execute_once: true
  locked:
    year: 2025
    reject_path_before_open: true
    release_only_for_final_test_after_freeze: true
  prohibit_2025_for:
    - training
    - normalization
    - architecture_selection
    - hyperparameter_selection
    - checkpoint_selection
    - gate_repair
    - baseline_calibration
    - early_stopping

lineage:
  representation_selected_checkpoint: artifacts/e2e_moe_hybrid_r4_v5_formal/seed=20240813/phase=representation/checkpoints/representation_seed20240813_selected_best.pt
  representation_state: artifacts/e2e_moe_hybrid_r4_v5_formal/seed=20240813/phase=representation/state.json
  source_residual_anchor: artifacts/e2e_moe_distributional_r4_v6_formal/capability/distribution/frozen_training_residual_baseline_n256.pt
  frozen_residual_anchor: artifacts/e2e_moe_joint_world_policy_r4_v7_2025final/data/frozen_training_residual_anchor_2022_2023_722.pt
  warm_start_checkpoint: artifacts/e2e_moe_joint_world_policy_r4_v7/seed=20240813/phase=d0/checkpoints/candidates/cycle=0031.pt
  train_only_normalization: artifacts/e2e_moe_hybrid_r4_v5_formal/data/train_only_normalization.json
  frozen_physical_twin: artifacts/research/physical/run_id=paper-physical-v1/frozen_physical_artifact.json
  adopted_representation_epoch: 28
  v6_failure_history_read_only: artifacts/e2e_moe_distributional_r4_v6_formal/state.json
  new_checkpoint_lineage_required: true

data:
  intervals_per_day: 96
  zones: [WEST, CAPITL, N.Y.C., LONGIL]
  zonal_features: 21
  selection_bundle_root: artifacts/dart_value_select/counterfactual_inputs/v1/selection/daily_bundles
  official_settlement_root: artifacts/dart_value_select/real_input_preparation/v1/official_rt_recovery/nyiso_replay_by_date/selection
  frozen_physical_twin: artifacts/research/physical/run_id=paper-physical-v1/frozen_physical_artifact.json
  frozen_physical_surrogate: artifacts/research/physical/run_id=paper-physical-v1/frozen_piecewise_surrogate.json
  physical_calibration_manifest: artifacts/research/physical/run_id=paper-physical-v1/physical_calibration_manifest.json
  issue_time_contract:
    day_ahead_issued_from_completed_days_only: true
    day_ahead_frozen_before_current_day_origin_zero: true
    revealed_prefix_fixed: true
    unrevealed_suffix_resampled_at_every_origin: true
  normalization:
    source: v7_development_train_2022_2023
    fit_split: train
    frozen_after_materialization: true

model:
  sequence_length: 96
  latent_width: 128
  representation:
    checkpoint: inherited_capability_selected
    trainable: false
    physical_core_trainable: false
  distribution:
    architecture: bounded_baseline_residual_transport
    initial_state_exactly_reproduces_frozen_anchor: true
    anchor_sampling: whole_day_joint_residual
    conditional_transport: zero_initialized_bounded_neural_residual
    residual_formula: anchor_plus_gate_times_cap_times_tanh_delta
    time_tokens: 96
    memory_width: 128
    dependence_rank: 16
    regime_width: 32
    tail_width: 32
    outputs: [samples, weights, center, scale, memory, tail, regime_probabilities]
    exact_identity: rt = da - dart
    final_forward_closure: dart = da - rt
  world_reader:
    origin_conditioned: true
    reads: [future_distribution_tokens, dependence_tokens, regime_tokens, rolling_state]
    risk_windows: [current, next_1h, next_4h, remaining_day]
    never_pool_entire_day_to_one_mean: true
  decision_moe:
    experts: 8
    top_k: 2
    expert_hidden_width: 256
    router_inputs: [rolling_state, regime, action_conditioned_risk]
  policy:
    free_actions: [day_ahead, battery, compute]
    plan_decoder: shared_96_step_plan
    current_action: gather_origin_from_shared_plan
    duplicate_current_and_suffix_heads: false
    issue_day_ahead_at_origin: 0
    freeze_day_ahead_after_issue: true
    decision_adapter_trainable: true
  critic:
    action_conditioned: true
    outputs: [expected, var, cvar, sla, intervention]
    feedback_refinement_steps: 2
    neural_risk_is_auxiliary: true
    policy_risk_source: post_shield_world_rollout
  scope_exclusions:
    - cross_site_workload_migration
    - home_site_queue_transfer
    - migration_energy_or_bandwidth_claims

sampling:
  train: 64
  cheap_validation: 64
  formal_probability: 256
  formal_empirical_risk: 512
  formal_paths_shared_by_all_models_and_baselines: true
  path_seed: 20240813
  policy_inference_default_samples: 0

runtime:
  backend: deterministic_analytic_constraint_shield
  external_solver: false
  forbidden_active_imports: [pyomo, gurobipy, cvxpy, cvxpylayers, optnet]
  rolling_origins: 96
  issue_day_ahead_before_realized_prefix: true
  execute_current_action_only: true
  shared_torch_numpy_shield: true
  shield_equations_single_source: true
  enforced_constraints:
    - grid_power_envelope
    - battery_power_and_soc
    - edf_compute_service
    - terminal_soc
    - terminal_backlog
  validation_tolerance: 1.0e-5

training:
  optimizer: adamw
  distribution_learning_rate: 2.0e-4
  decision_learning_rate: 1.0e-4
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  early_stopping_patience_cycles: 12
  d0_objective_revision: 2
  mixed_precision: bf16
  score_accumulation_dtype: float32
  decision_microbatch_days: 1
  decision_microbatch_semantics: exact_day_weighted_gradient_accumulation_one_optimizer_step
  decision_origin_budget: 8
  coverage_cycle:
    days: 722
    optimizer_updates: 4
    update_day_counts: [181, 181, 180, 180]
    each_day_exactly_once: true
    reshuffle_between_cycles: true
  gradient_boundary:
    distribution_updates: proper_scores_only
    decision_updates_distribution_truth: detached
    decision_trainable: [decision_adapter, actor, critic, decision_moe]
    forbid_policy_gradient_through_distribution_scale_or_tail: true
  fixed_scales:
    source: frozen_training_residual_anchor_and_train_edf_baseline
    never_recompute_from_batch: true
    channel_scale_shape: 21
    proper_score_space: frozen_channel_normalized_residual_space
    required_proper_scores: [center_scale, energy_score, marginal_crps, interval, tail, dependence]
    cost: train_price_aware_edf_median_absolute_daily_cost
  distribution_loss_weights:
    center_scale: 0.10
    energy_score: 3.00
    marginal_crps: 1.00
    interval: 0.25
    tail: 0.75
    dependence: 0.50
    coverage90_hinge: 250.00
    coverage95_hinge: 100.00
    diversity: 0.02
    identity: 0.0
  policy_loss_weights:
    p0: {relative_cost: 1.0, ru_cvar: 0.10, sla: 10.0, terminal: 10.0, shield_intervention: 2.0, action_smoothness: 0.02, critic: 0.25, anchor_imitation: 1.0}
    j1: {relative_cost: 1.0, ru_cvar: 0.25, sla: 10.0, terminal: 5.0, shield_intervention: 1.0, action_smoothness: 0.02, critic: 0.25}
    j2: {relative_cost: 1.0, ru_cvar: 0.25, sla: 10.0, terminal: 5.0, shield_intervention: 1.0, action_smoothness: 0.02, critic: 0.25}
    j3: {relative_cost: 1.0, ru_cvar: 0.35, sla: 10.0, terminal: 5.0, shield_intervention: 1.0, action_smoothness: 0.02, critic: 0.25}
    a1: {relative_cost: 1.0, ru_cvar: 0.25, sla: 10.0, terminal: 5.0, shield_intervention: 1.0, action_smoothness: 0.02, critic: 0.25}
    a2: {relative_cost: 1.0, ru_cvar: 0.35, sla: 10.0, terminal: 5.0, shield_intervention: 1.0, action_smoothness: 0.02, critic: 0.25}
  cvar:
    alpha: 0.95
    training_surrogate: smooth_rockafellar_uryasev
    smooth_temperature: 0.02
    formal_metric: exact_post_shield_empirical_cvar_n512
  phases:
    d0:
      purpose: baseline_anchored_distribution_repair
      min_cycles: 10
      max_cycles: 100
      sample_count: 64
      sample_schedule:
        warmup_sample_count: 32
        warmup_optimizer_updates: 40
      update_ratio: {distribution: 1, decision: 0}
      early_stopping: true
      release_gate: full_distribution_gate
    p0:
      purpose: analytic_edf_anchor_policy_warmup
      min_cycles: 10
      max_cycles: 10
      sample_count: 64
      update_ratio: {distribution: 0, decision: 1}
      early_stopping: false
      required_horizons: [8, 24, 48, 96]
    j1:
      purpose: distribution_dominant_joint_training
      min_cycles: 10
      max_cycles: 60
      sample_count: 64
      update_ratio: {distribution: 2, decision: 1}
      early_stopping: true
    j2:
      purpose: balanced_joint_training
      min_cycles: 10
      max_cycles: 80
      sample_count: 64
      update_ratio: {distribution: 1, decision: 1}
      early_stopping: true
    j3:
      purpose: decision_dominant_joint_training
      min_cycles: 10
      max_cycles: 60
      sample_count: 64
      update_ratio: {distribution: 1, decision: 2}
      early_stopping: true
    calibration_restore:
      purpose: restore_proper_score_calibration
      min_cycles: 5
      max_cycles: 5
      sample_count: 64
      update_ratio: {distribution: 1, decision: 0}
      early_stopping: false
    a1:
      purpose: dart_adapter_noninferiority_ablation
      min_cycles: 10
      max_cycles: 30
      sample_count: 64
      update_ratio: {distribution: 1, decision: 1}
      early_stopping: true
      trainable_name_contains: [dart, risk_bridge, decision_router]
      inherit_distribution_and_policy_gates: true
    a2:
      purpose: allowed_joint_adapter_moe_policy_ablation
      min_cycles: 10
      max_cycles: 45
      sample_count: 64
      update_ratio: {distribution: 1, decision: 1}
      early_stopping: true
      physical_core_frozen: true
      inherit_distribution_and_policy_gates: true
  candidate_selection:
    mode: bounded_pareto_then_full_gate
    top_k: 5
    objectives: [energy_score_delta_upper, marginal_crps_ratio, coverage95_error, tail_score_ratio, daily_cost_delta_upper, normalized_sla_increase]
    full_gate_frequency: pareto_candidates_only
    no_full_corpus_hash_per_epoch: true

capability_gates:
  distribution:
    validation_days: 364
    baseline: frozen_training_residual_sampling
    formal_probability_sample_count: 256
    bootstrap:
      method: paired_circular_moving_block
      block_days: 7
      replicates: 10000
      confidence: 0.95
      seed: 20240813
    noninferiority_margin_fraction: 0.01
    energy_score_paired_one_sided_upper_strictly_below: 0.0
    marginal_crps_ratio_at_most: 1.01
    interval_score_ratio_at_most: 1.01
    tail_score_ratio_at_most: 1.01
    dependence_score_ratio_at_most: 1.01
    maximum_absolute_coverage_error: 0.03
    identity_tolerance: 1.0e-6
    checkpoint_selection_order: [energy_score_delta_one_sided_upper, marginal_crps, coverage95_error, tail_score_noninferiority_one_sided_upper, cycle]
    pass_only_checkpoint_selection: true
    mae_is_not_a_gate_or_selection_metric: true
  policy:
    validation_days: 364
    rolling_origins: 34944
    daily_cost_paired_one_sided_upper_at_most: 0.0
    maximum_normalized_sla_increase: 0.001
    feasibility_fraction: 1.0
    maximum_non_exogenous_rejected_origins: 0
  a1:
    inherit_distribution_and_policy_without_relaxation: true
    require_exact_gradient_allowlist: true
  a2:
    inherit_distribution_and_policy_without_relaxation: true
    require_physical_core_frozen: true

evaluation:
  risk:
    sample_count: 512
    exact_post_shield_replay: true
    common_random_paths_across_methods: true
    model_self_scoring_forbidden: true
  reporting:
    primary_distribution_metric: energy_score_paired_upper
    primary_policy_metric: paired_daily_cost_upper
    mae_is_not_a_capability_gate: true
    persist_daily_rows: true

audit:
  level: reduced_non_repetitive
  checkpoint_manifest_once_per_pareto_candidate: true
  repeat_large_checkpoint_hash_each_epoch: false
  repeat_full_corpus_hash_each_epoch: false
  full_gate_only_for_pareto_top_five: true

artifacts:
  root: artifacts/e2e_moe_joint_world_policy_r4_v7_2025final
  runtime_log: runtime.log
  training_contract: training_contract.json
  pareto_candidates: pareto_candidates.json
  preserve_v6_failure_history: true
