[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-dc-vpp"
version = "0.1.0"
description = "NLR-calibrated data-center VPP twins for counterfactual NYISO experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<25",
  "duckdb>=1.1,<2",
  "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "pyomo>=6.9,<7",
  "highspy>=1.11,<2",
  "requests>=2.32,<3",
  "tenacity>=8.3,<10",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "psutil>=6,<8",
]

[project.optional-dependencies]
paper = [
  "lightgbm>=4.3,<5",
  "statsmodels>=0.14,<1",
  "ncps==1.0.1",
  "gridstatus>=0.36,<1",
  "pvlib>=0.11,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pandera>=0.20,<1",
  "matplotlib>=3.9,<4",
]
weather = [
  "eccodes>=2.47,<3",
  "numcodecs>=0.16,<1",
]
test = ["pytest>=8,<9"]

[project.scripts]
dcvpp = "dcvpp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
